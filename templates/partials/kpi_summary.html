<!-- Today's headline KPIs (shared by Home and Live) -->
<section class="row g-3 mb-4" aria-label="Today's summary">
  <div class="col-6 col-xl-3">
    <div class="kpi-card">
      <div class="kpi-head">
        <span class="kpi-title">Deliveries today</span>
        <span class="kpi-icon"><i class="bi bi-truck" aria-hidden="true"></i></span>
      </div>
      <div class="kpi-value">8<span class="kpi-unit">/ 12</span></div>
      <div class="progress progress-xs mt-3" role="progressbar" aria-label="Deliveries completed" aria-valuenow="67" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar bg-chart-1" style="width: 67%;"></div>
      </div>
      <div class="kpi-meta">4 remaining today</div>
    </div>
  </div>
  <div class="col-6 col-xl-3">
    <div class="kpi-card">
      <div class="kpi-head">
        <span class="kpi-title">Takt compliance</span>
        <span class="kpi-icon"><i class="bi bi-stopwatch" aria-hidden="true"></i></span>
      </div>
      <div class="kpi-value">75<span class="kpi-unit">%</span></div>
      <div class="kpi-meta"><span class="badge-status badge-warn">At risk</span>cycles within 90 min</div>
    </div>
  </div>
  <div class="col-6 col-xl-3">
    <div class="kpi-card">
      <div class="kpi-head">
        <span class="kpi-title">Breaches today</span>
        <span class="kpi-icon"><i class="bi bi-exclamation-octagon" aria-hidden="true"></i></span>
      </div>
      <div class="kpi-value">2</div>
      <div class="kpi-meta"><span class="badge-status badge-crit">Needs review</span><a href="{{ url_for('alerts') }}">View alerts</a></div>
    </div>
  </div>
  <div class="col-6 col-xl-3">
    <div class="kpi-card">
      <div class="kpi-head">
        <span class="kpi-title">Trucks in use</span>
        <span class="kpi-icon"><i class="bi bi-truck-front" aria-hidden="true"></i></span>
      </div>
      <div class="kpi-value">2<span class="kpi-unit">/ 2</span></div>
      <div class="progress progress-xs mt-3" role="progressbar" aria-label="Trucks in use" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-bar bg-chart-1" style="width: 100%;"></div>
      </div>
      <div class="kpi-meta">No spare trucks</div>
    </div>
  </div>
</section>
